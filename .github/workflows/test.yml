name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Hook, autopilot and window (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: for f in hooks/needs-you.sh bin/nb-autopilot bin/needs-you-window tests/*.sh; do bash -n "$f" || exit 1; done
      - name: Manifests are valid JSON
        run: jq -e . .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json > /dev/null
      - name: Inbox
        run: bash tests/test.sh
      - name: Autopilot
        run: bash tests/autopilot-test.sh
      - name: Window (Swift)
        run: bash tests/window-test.sh window.png
      - name: Window screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window
          path: window.png
          if-no-files-found: ignore

  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x hooks/needs-you.sh bin/nb-autopilot bin/needs-you-window tests/*.sh
